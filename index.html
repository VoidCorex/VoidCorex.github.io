<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зона Скачивания</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 100px;
        }
        .download-btn {
            display: inline-block;
            padding: 20px 40px;
            font-size: 22px;
            color: white;
            background-color: #2ed573;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: 0.2s;
        }
        .download-btn:hover {
            background-color: #26af5f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Скачать мою штуку</h1>
    <p>Нажми на кнопку ниже, чтобы загрузить файл на устройство:</p>

    <a href="my_game.apk" download="SuperClicker.apk" class="download-btn">СКАЧАТЬ ФАЙЛ</a>

</body>
</html>
